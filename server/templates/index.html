<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ESP32 Monitor</title>

    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <header class="topbar">
      <div>
        <h1>ESP32 Monitor</h1>
        <p>Environmental monitoring system</p>
      </div>

      <div class="topbar-right">
        <span>System OK</span>
        <span id="clock">--:--:--</span>
      </div>
    </header>

    <main class="dashboard">
      <section class="panel">
        <h2>Ostatnie pomiary</h2>

        <table>
          <tr>
            <th>ID</th>
            <th>Urządzenie</th>
            <th>Temperatura</th>
            <th>Wilgotność</th>
            <th>Alarm</th>
            <th>Czas</th>
          </tr>

          {% for row in measurements %}
          <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }} °C</td>
            <td>{{ row[3] }} %</td>

            <td>{% if row[4] %} Tak {% else %} Nie {% endif %}</td>

            <td>{{ row[5] }}</td>
          </tr>
          {% endfor %}
        </table>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
