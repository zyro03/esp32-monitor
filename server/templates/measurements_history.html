<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pełna historia pomiarów</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <header class="topbar">
      <h1>Pełna historia pomiarów</h1>

      <div class="topbarright">
        <a class="toplink" href="/">Strona główna</a>
      </div>
    </header>

    <main class="dashboard">
      <section class="pagepanel">
        <h2>Wszystkie pomiary</h2>

        <div class="pagewrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Urządzenie</th>
                <th>Temperatura</th>
                <th>Wilgotność</th>
                <th>Alarm</th>
                <th>Czas</th>
              </tr>
            </thead>

            <tbody>
              {% for row in measurements %}
              <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }} °C</td>
                <td>{{ row[3] }} %</td>
                <td>{% if row[4] %}Tak{% else %}Nie{% endif %}</td>
                <td>{{ row[5] }}</td>
              </tr>
              {% else %}
              <tr>
                <td colspan="6">Brak zapisanych pomiarów</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
